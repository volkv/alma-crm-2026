name: CI

on:
  push:
    branches: ['**']
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Одна задача на весь гейт, и внутри неё — ровно тот же `check:all`, который
# разработчик гоняет у себя. Разъезжаться этим двум спискам нельзя: проверка,
# которой нет на машине, ловится только после push, а проверка, которой нет в CI,
# не ловится вовсе. Поэтому и `docker build`, и аудит зависимостей живут внутри
# `check:all`, а не отдельными задачами workflow.
jobs:
  check:
    name: Lint, types, tests, build, image, audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install poppler-utils (pdftotext) and LibreOffice (soffice), needed by the integration tests
        run: |
          sudo apt-get update
          sudo apt-get install -y poppler-utils libreoffice-calc

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Install the Playwright browser
        run: pnpm exec playwright install --with-deps chromium

      - run: pnpm run check:all

      - name: Upload the Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

      # Трассы, снимки экрана и видео упавших проверок: отчёт ссылается на них,
      # и без них он показывает только текст ошибки.
      - name: Upload the Playwright artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: test-results/
          retention-days: 7
          if-no-files-found: ignore
