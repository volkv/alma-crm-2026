name: CI

on:
  push:
    branches: ['**']
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Каждая задача здесь — команда, которую разработчик гоняет у себя. `check:all`
# на машине — это последовательно `check:audit`, `check:fast`, `test:integration`,
# `test:e2e` и `check:docker`; в CI те же команды разнесены по параллельным
# задачам, и прогон идёт столько, сколько самая долгая из них, а не их сумма.
# Разъезжаться этим спискам нельзя: проверка, которой нет на машине, ловится
# только после push, а проверка, которой нет в CI, не ловится вовсе.
#
# Сканеры вынесены в отдельную задачу, а не добавлены в `check:all`: их вердикт
# зависит от внешних лент — базы уязвимостей Trivy и реестра правил semgrep, — и
# меняется без единой правки в коде. Зелёный вчера код краснеет сегодня, и это
# не повод блокировать сборку кода. Локально проверки повторяются одной командой
# `pnpm run check:security` — см. `docs/security.md`.
jobs:
  static:
    name: Audit, lint, types, unit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Кэши ESLint, Prettier и разобранных модулей Vitest привязаны к содержимому
      # файлов, поэтому прошлый прогон годится как отправная точка: холодный
      # линт идёт три минуты, тёплый — секунды на изменённые файлы. Ключ
      # уникален на коммит, восстанавливается ближайший по префиксу.
      - uses: actions/cache@v4
        with:
          path: |
            node_modules/.cache
            node_modules/.vitest-cache
          key: static-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.sha }}
          restore-keys: static-${{ hashFiles('pnpm-lock.yaml') }}-

      - run: pnpm run check:audit

      - run: pnpm run check:fast

  # Файлы идут по одному (`fileParallelism: false` в `vite.config.ts`), поэтому
  # набор режется на две части по файлам и идёт двумя машинами. У каждой части
  # свои контейнеры PostgreSQL, Redis и MinIO.
  integration:
    name: Integration (${{ matrix.shard }}/2)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - uses: actions/checkout@v5

      # `pdftotext` и `pdfinfo`: выгрузка отчёта в PDF сверяется по тексту и
      # размеру страницы (`tests/integration/reports/writers.test.ts`).
      - name: Install poppler-utils
        run: |
          sudo apt-get update
          sudo apt-get install -y poppler-utils

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm run test:integration --shard=${{ matrix.shard }}/2

  e2e:
    name: End-to-end
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Браузер кэшируется по lock-файлу: версия Chromium привязана к версии
      # Playwright. Системные библиотеки ставятся всё равно — их кэш не хранит.
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install the Playwright browser
        run: pnpm exec playwright install --with-deps chromium

      # Сборку делает сам прогон: `webServer` в `playwright.config.ts` собирает
      # приложение перед запуском, отдельный `pnpm run build` был бы второй сборкой.
      - run: pnpm run test:e2e

      - name: Upload the Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

      # Трассы, снимки экрана и видео упавших проверок: отчёт ссылается на них,
      # и без них он показывает только текст ошибки.
      - name: Upload the Playwright artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: test-results/
          retention-days: 7
          if-no-files-found: ignore

  # Образу ни Node, ни зависимостей проекта не нужно: он собирается сам по
  # `Dockerfile`, как в `check:docker`.
  docker:
    name: Docker image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - run: docker build .

  security:
    name: Semgrep, Trivy, SBOM
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # Сканеры и сборка образа живут в контейнерах, поэтому ни Node, ни
      # зависимостей проекта этой задаче не нужно: только рабочая копия и Docker.
      - name: Scan the code, the dependencies and the image
        run: bash scripts/security-scan.sh
        env:
          SECURITY_REPORT_DIR: security-report
          SECURITY_TRIVY_CACHE: ${{ runner.temp }}/trivy-cache

      # Отчёты нужны и на зелёном прогоне: SBOM — это состав поставки, а находки
      # ниже порога отказа читают глазами. На упавшем прогоне выгружается то, что
      # успело собраться, и пустой каталог не должен подменять собой настоящую
      # причину падения — отсюда предупреждение вместо ошибки.
      - name: Upload the security reports and the SBOM
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-reports
          path: security-report/
          retention-days: 30
          if-no-files-found: warn

  # Комплект документации: PDF по каждому документу репозитория и общий файл.
  # Отдельной задачей, а не шагом внутри `check:all`, по той же причине, что и
  # сканеры: гейт кода от неё не зависит и не ждёт её, а собранный комплект
  # нужен и на зелёном прогоне — его забирают артефактом и отдают читателю.
  # Сломанный комплект (пропала картинка, переименован документ) при этом всё
  # равно виден: задача краснеет.
  docs-pdf:
    name: Documentation PDF
    runs-on: ubuntu-latest

    # Печатает ту же службу, что печатает отчёты и договоры в работающей
    # системе. Ни базы, ни хранилища, ни самого приложения сборщику не нужно:
    # он читает файлы репозитория и ходит в службу напрямую.
    services:
      gotenberg:
        image: gotenberg/gotenberg:8
        ports:
          - 3001:3000
        options: >-
          --health-cmd "curl --silent --fail http://localhost:3000/health"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Build the documentation kit
        run: pnpm run docs:pdf
        env:
          GOTENBERG_URL: http://localhost:3001

      # Каталог целиком, а не один общий файл: рядом с ним лежат отдельные PDF
      # документов, и читателю, которому нужен только контракт обмена, не
      # приходится листать весь комплект.
      - name: Upload the documentation kit
        uses: actions/upload-artifact@v4
        with:
          name: documentation-pdf
          path: dist/docs-pdf/
          retention-days: 30
