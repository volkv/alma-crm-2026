name: CI

on:
  push:
    branches: ['**']
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Каждая задача здесь — ровно одна команда, которую разработчик гоняет у себя:
# `check:all` и `check:security`. Разъезжаться этим спискам нельзя: проверка,
# которой нет на машине, ловится только после push, а проверка, которой нет в CI,
# не ловится вовсе. Поэтому и `docker build`, и аудит зависимостей живут внутри
# `check:all`, а не отдельными шагами workflow.
#
# Сканеры вынесены во вторую задачу, а не добавлены в `check:all`, по двум
# причинам. Во-первых, их вердикт зависит от внешних лент — базы уязвимостей
# Trivy и реестра правил semgrep, — и меняется без единой правки в коде: зелёный
# вчера код краснеет сегодня, и это не повод блокировать сборку кода. Во-вторых,
# задачи идут параллельно, поэтому общее время прогона не растёт. Локально
# проверки повторяются одной командой `pnpm run check:security` — см.
# `docs/security.md`.
jobs:
  check:
    name: Lint, types, tests, build, image, audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install poppler-utils (pdftotext) and LibreOffice (soffice), needed by the integration tests
        run: |
          sudo apt-get update
          sudo apt-get install -y poppler-utils libreoffice-calc

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Install the Playwright browser
        run: pnpm exec playwright install --with-deps chromium

      - run: pnpm run check:all

      - name: Upload the Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

      # Трассы, снимки экрана и видео упавших проверок: отчёт ссылается на них,
      # и без них он показывает только текст ошибки.
      - name: Upload the Playwright artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: test-results/
          retention-days: 7
          if-no-files-found: ignore

  security:
    name: Semgrep, Trivy, SBOM
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # Сканеры и сборка образа живут в контейнерах, поэтому ни Node, ни
      # зависимостей проекта этой задаче не нужно: только рабочая копия и Docker.
      - name: Scan the code, the dependencies and the image
        run: bash scripts/security-scan.sh
        env:
          SECURITY_REPORT_DIR: security-report
          SECURITY_TRIVY_CACHE: ${{ runner.temp }}/trivy-cache

      # Отчёты нужны и на зелёном прогоне: SBOM — это состав поставки, а находки
      # ниже порога отказа читают глазами. На упавшем прогоне выгружается то, что
      # успело собраться, и пустой каталог не должен подменять собой настоящую
      # причину падения — отсюда предупреждение вместо ошибки.
      - name: Upload the security reports and the SBOM
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-reports
          path: security-report/
          retention-days: 30
          if-no-files-found: warn
