# Нагрузочный стенд: третье наложение поверх `docker-compose.yml` и
# `docker-compose.prod.yml`.
#
#   docker compose -p lct-load --env-file scripts/load/load.env \
#     -f docker-compose.yml -f docker-compose.prod.yml -f scripts/load/compose.load.yml \
#     up -d --build
#
# Зачем он есть. Мерить надо то, что уезжает на стенд, — образ приложения в
# режиме production и с тем же потолком памяти, — поэтому основой взято
# производственное наложение. Но оно берёт конфигурацию из `.env` рядом с
# исходниками и поднимается под именем проекта разработки, а обе эти вещи на
# машине разработчика заняты: `.env` описывает его собственный стенд, а
# контейнеры этого имени в это время обслуживают прогон e2e. Поэтому
# нагрузочный стенд:
#
#   * поднимается под своим именем проекта (`-p lct-load`) — свои контейнеры,
#     свои тома, своя база; чужие прогоны он не трогает;
#   * читает не `.env`, а `scripts/load/load.env`;
#   * публикует только приложение (3100) и каталог учётных записей (3180), и
#     только на 127.0.0.1.
#
# Каталог учётных записей возвращён в режим `start-dev`: производственный режим
# требует публичного имени за обратным прокси, которого у локального прогона
# нет. На измеряемое это не влияет — вход происходит один раз на VU и в замеры
# операций не входит.
#
# После прогона: `docker compose -p lct-load down -v`.

services:
  postgres:
    # Потолок производственного наложения рассчитан на стенд демонстрации;
    # нагрузочная база держит в разы больше строк, и с 512 МБ замер показал бы
    # скорость чтения с диска, а не работу системы.
    deploy:
      resources:
        limits:
          memory: 1G

  keycloak:
    command: !override ['start-dev', '--import-realm']
    ports: !override
      - '127.0.0.1:3180:8080'
    environment:
      # `start-dev` берёт имя из запроса, а приложение проверяет `iss` по
      # объявленному адресу: без закреплённого имени токен не прошёл бы
      # собственную проверку. Путь возвращается в корень — за прокси стенд не
      # стоит, и `/auth` только удлинял бы адреса.
      KC_HOSTNAME: ${OIDC_PUBLIC_URL}
      KC_HTTP_RELATIVE_PATH: /

  app:
    ports: !override
      - '127.0.0.1:3100:3000'
    env_file: !override
      - scripts/load/load.env
    environment:
      # Производственное наложение закрепляет здесь `/auth` — путь, по которому
      # каталог стоит за обратным прокси. На этом стенде он в корне.
      OIDC_INTERNAL_URL: http://keycloak:8080
