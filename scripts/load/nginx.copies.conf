# Обратный прокси нагрузочного стенда с несколькими копиями приложения
# (`compose.copies.yml`).
#
# `server app:3000` раскрывается в адреса всех реплик сервиса на старте nginx,
# и запросы идут по ним по кругу. Реплики, поднятые после прокси, он не видит:
# `run.sh up` перезапускает его после масштабирования.

worker_processes 1;

events {
	worker_connections 1024;
}

http {
	upstream app {
		server app:3000;
		keepalive 64;
		# Короче, чем держит простаивающее соединение Node (пять секунд):
		# иначе прокси отправит запрос в соединение, которое копия уже
		# закрыла, и сочтёт копию упавшей.
		keepalive_timeout 4s;
	}

	server {
		listen 80;
		client_max_body_size 27m;

		location / {
			proxy_pass http://app;
			proxy_http_version 1.1;
			proxy_set_header Connection '';
			proxy_set_header Host $http_host;
			# Адрес пользователя сценарий ставит сам (`session.js`), как его
			# ставил бы прокси перед людьми: здесь он передаётся как есть, иначе
			# все VU пришли бы с одного адреса прокси.
			proxy_set_header X-Forwarded-For $http_x_forwarded_for;
			proxy_read_timeout 120s;
			# Заголовок `Link` страницы с предзагрузкой модулей вырастает до
			# 4–5 КБ: с буфером по умолчанию прокси отвечает 502. Те же
			# значения, что у стенда (`docs/deployment.md`).
			proxy_buffer_size 32k;
			proxy_buffers 8 32k;
			proxy_busy_buffers_size 64k;
		}
	}
}
