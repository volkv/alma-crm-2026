# Нагрузочный стенд с несколькими копиями приложения — четвёртое наложение
# поверх `compose.load.yml`. Включает его `run.sh` при `APP_COPIES` больше
# одного.
#
# Зачем. Одна копия приложения — это один поток JavaScript: разбор ответов
# базы, сборка запросов, отрисовка страницы и сборка мусора идут в нём по
# очереди. Когда он занят, запрос ждёт его, а не базу (`docs/performance.md`,
# раздел «Замер мощности»). Масштабируется приложение копиями за обратным
# прокси — так же, как на развёртывании за nginx; это наложение ставит ту же
# схему на нагрузочный стенд, чтобы её можно было измерить.
#
# Копии — реплики одного сервиса `app` (`docker compose up --scale`): образ,
# окружение и потолок памяти у них общие. Наружу смотрит только прокси `lb` на
# том же 127.0.0.1:3100, поэтому сценарии и адрес входа не меняются.

services:
  app:
    # Реплики не могут делить один опубликованный порт: наружу смотрит прокси.
    ports: !reset []

  lb:
    image: nginx:1.29-alpine
    depends_on:
      app:
        condition: service_healthy
    ports:
      - '127.0.0.1:3100:80'
    volumes:
      - ./scripts/load/nginx.copies.conf:/etc/nginx/nginx.conf:ro
