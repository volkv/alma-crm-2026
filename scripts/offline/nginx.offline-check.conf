# Вход в стек проверки без интернета (`compose.offline-check.yml`, сервис `edge`).
#
# Роль обратного прокси заказчика и ничего сверх: приложение в корне, каталог
# учётных записей под `/auth/`, страницы имитаторов под `/mock-cms/` и
# `/mock-lms/` — так же, как их раскладывает `deploy/nginx/crm.conf.example`.
# TLS здесь нет: прокси слушает только петлю хоста, и проверяется работа без
# интернета, а не шифрование канала.

server {
	listen 80;
	server_name _;

	# Вложения до 25 МБ плюс поля формы — тот же потолок, что у приложения
	# (`BODY_SIZE_LIMIT=27M`).
	client_max_body_size 27m;

	proxy_http_version 1.1;
	proxy_set_header Host $http_host;
	proxy_set_header X-Forwarded-For $remote_addr;
	proxy_set_header X-Forwarded-Proto $scheme;
	proxy_set_header X-Forwarded-Host $http_host;

	# Ответы входа несут крупные заголовки: куки сессии каталога, а на возврате
	# в приложение — куки его сессии. С буфером по умолчанию nginx отвечает 502.
	proxy_buffer_size 128k;
	proxy_buffers 4 256k;
	proxy_busy_buffers_size 256k;

	location / {
		# Живая карточка держит поток событий (SSE): буферизация задержала бы его.
		proxy_buffering off;
		proxy_read_timeout 1h;
		proxy_pass http://app:3000;
	}

	location /auth/ {
		proxy_pass http://keycloak:8080;
	}

	location /mock-cms/ {
		proxy_pass http://mock-cms:8081/;
	}

	location /mock-lms/ {
		proxy_pass http://mock-lms:8082/;
	}
}
