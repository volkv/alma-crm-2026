# Уровни правил пассивного скана ZAP для scripts/dast/dast-scan.sh.
# Формат zap-baseline.py: идентификатор, уровень, название (только для чтения).
# Правило, которого здесь нет, остаётся WARN: в отчёте, но сборку не валит.
# Причина каждого перевода в FAIL или INFO — docs/security.md,
# «Динамическое сканирование». IGNORE в этом файле нет: находка без отчёта
# неотличима от чистого ответа.
#
