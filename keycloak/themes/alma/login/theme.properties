# Форма входа каталога в облике Альма CRM: разметка и поведение — стандартной
# темы keycloak.v2, здесь только цвета, шрифт, знак и русские подписи.
parent=keycloak.v2
import=common/keycloak
styles=css/styles.css css/alma.css
locales=ru
favicons.mark=img/alma-mark.svg
favicons.mark.type=image/svg+xml
# Строка о системе над формой и, на демонстрационном стенде, блок быстрого
# входа: разметку keycloak.v2 скрипт не заменяет, а дополняет (js/alma.js).
scripts=js/alma.js
# Пароль демонстрационных записей — та же переменная контейнера, из которой его
# берёт импорт `keycloak/demo-users.json`. Установка без демо-записей
# (docker-compose.production.yml) её не задаёт, мета-тег приходит пустым, и
# блока быстрого входа нет. Пробел и `==` в пароле разломали бы список мета-тегов
# шаблона — демонстрационный пароль их не содержит.
meta=alma-demo-password==${env.KEYCLOAK_DEMO_PASSWORD:}
