# Правки поверх русского перевода keycloak.v2: название системы вместо общей
# фразы «Вход в учетную запись» и текст кнопки — тот же, что у кнопки «Войти»
# на странице входа приложения (там форма каталога — следующий шаг после неё).
# Дальше — те же строки бандла, что видит человек в сценарии показа (форма
# входа, настройка второго фактора штатного администратора или руководителя),
# только с «ё» вместо «е» в «учётн-»: остальной бандл эту букву не использует
# нигде, трогать за пределами видимых экранов незачем.
loginAccountTitle=Вход в Альма CRM
doLogIn=Войти
loginTotpIntro=Вам необходимо настроить генератор одноразовых паролей для доступа к этой учётной записи
accountDisabledMessage=Учётная запись заблокирована, свяжитесь с администратором.
