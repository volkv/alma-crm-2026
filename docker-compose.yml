name: lct-crm

services:
  postgres:
    image: postgres:17-alpine
    # Пароль набран строкой и одинаков у всех: это локальный стек, его база
    # стоит на петле и заполнена синтетикой. Только локально — развёртывание
    # берёт свой пароль из `.env` (`POSTGRES_PASSWORD`, docker-compose.prod.yml),
    # и умолчание отсюда туда не доезжает.
    environment:
      POSTGRES_USER: lct
      POSTGRES_PASSWORD: lct
      POSTGRES_DB: lct
    # Host ports are shifted so the stack does not collide with a PostgreSQL or
    # Redis already running on the machine.
    ports:
      - '55432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
      # Creates the second database — the one Keycloak keeps its realm in. The
      # postgres image runs the scripts from this directory exactly once, when it
      # initialises an empty volume; on a stand that already works the database is
      # created by hand, see docs/deployment.md, section «Keycloak».
      - ./keycloak/initdb-keycloak.sh:/docker-entrypoint-initdb.d/10-keycloak.sh:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U lct -d lct']
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:8-alpine
    # Без пароля — только локально: развёртывание поднимает Redis с
    # `--requirepass` из `.env` (`REDIS_PASSWORD`, docker-compose.prod.yml).
    command: ['redis-server', '--appendonly', 'yes']
    ports:
      - '56379:6379'
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 20

  # The account directory and the only way into the app: realm `lct` with three
  # roles and the second factor for the privileged ones is imported from
  # `keycloak/realm-lct.json`, the three demo accounts from
  # `keycloak/demo-users.json`. The app
  # keeps no passwords of its own (docs/auth.md), so without this container
  # nobody signs in. How realm roles map onto ours: docs/access-matrix.md,
  # section 6.
  keycloak:
    image: quay.io/keycloak/keycloak:26.7.4
    # `start-dev`: the built-in H2 database inside the container and a hostname
    # taken from the request. In development Keycloak is reached both from
    # outside (a browser, `localhost:58080`) and from inside the network
    # (`keycloak:8080`), and start-dev answers on whichever address the request
    # came to. A deployment cannot work that way — there it is PostgreSQL and a
    # pinned `KC_HOSTNAME`, see docker-compose.prod.yml.
    #
    # That database deliberately has no volume: the realm is defined by a file,
    # and a recreated container comes up as exactly what `keycloak/realm-lct.json`
    # says, not as whatever someone clicked together in the console.
    command: ['start-dev', '--import-realm']
    environment:
      # The administrator of Keycloak itself (realm `master`), not an account of
      # the CRM. The defaults are good enough for a local stack; a stand passes
      # its own through `.env`.
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
      # Health endpoints answer on the management port 9000 and are off by default.
      KC_HEALTH_ENABLED: 'true'
      # The address Keycloak knows itself by. Pinned on purpose: `start-dev`
      # otherwise takes the hostname from the request, so a browser coming to
      # the published port gets `iss=http://localhost:58080/...` while the app
      # asking from inside the network gets `iss=http://keycloak:8080/...` — and
      # the token then fails the `iss` check it is supposed to pass. One public
      # name, and server-side calls go to `keycloak:8080` through
      # OIDC_INTERNAL_URL of the app.
      KC_HOSTNAME: http://localhost:58080
      # Placeholders of the realm file: `${VAR:default}` is expanded at import
      # time from the environment of this container (keycloak/README.md).
      #
      # CRM_ORIGIN is the address a browser opens the app at; it becomes a redirect
      # URI of the client. In the local stack it is the published port of the app,
      # on a stand it is its public address.
      CRM_ORIGIN: http://localhost:3000
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:-lct-crm-dev-secret}
      # The shared password of the three demo accounts — the same one the seed
      # gives them in the app's own database: the accounts are the same people,
      # and their password is one.
      KEYCLOAK_DEMO_PASSWORD: ${SEED_DEMO_PASSWORD:-lct-demo-2026}
    # The host port is shifted the same way as PostgreSQL and Redis; inside the
    # network Keycloak answers on 8080.
    ports:
      - '58080:8080'
    # Two files under the names the directory import pairs by: `<realm>-realm.json`
    # is the realm itself, `<realm>-users-0.json` the users imported into it. The
    # demo accounts live in the second file so that an installation without them
    # mounts only the first (docker-compose.production.yml); under any other name
    # Keycloak imports the realm and silently skips the users file.
    volumes:
      - ./keycloak/realm-lct.json:/opt/keycloak/data/import/lct-realm.json:ro
      - ./keycloak/demo-users.json:/opt/keycloak/data/import/lct-users-0.json:ro
    healthcheck:
      # The image carries neither curl nor wget — only bash, so the request to
      # `/health/ready` on the management port goes through /dev/tcp.
      test:
        [
          'CMD-SHELL',
          'exec 3<>/dev/tcp/127.0.0.1/9000 && printf "GET /health/ready HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n" >&3 && grep -q "\"status\": \"UP\"" <&3'
        ]
      interval: 5s
      timeout: 5s
      retries: 30

  gotenberg:
    image: gotenberg/gotenberg:8
    ports:
      - '3001:3000'
    healthcheck:
      test: ['CMD', 'curl', '--silent', '--fail', 'http://localhost:3000/health']
      interval: 10s
      timeout: 5s
      retries: 10

  # Почтовый сервер стенда: ловит всю исходящую почту и никуда её не выпускает.
  # Уведомления о зависших взаимодействиях уходят по-настоящему, по SMTP, и
  # показывать их на стенде надо так же по-настоящему — но синтетические адреса
  # демонстрационных записей ведут в никуда, а письмо на настоящий адрес с
  # публичного стенда было бы рассылкой. Веб-интерфейс на http://localhost:8025
  # показывает каждое письмо целиком; API `/api/v1/messages` читает прогон.
  mailpit:
    image: axllent/mailpit:v1.31.1
    ports:
      - '1025:1025'
      - '8025:8025'
    healthcheck:
      test: ['CMD', '/mailpit', 'readyz']
      interval: 10s
      timeout: 5s
      retries: 10

  # Object storage for uploaded and generated documents. The image comes from
  # quay.io: MinIO publishes its releases there, and the tag is pinned like
  # every other image in the stack.
  minio:
    image: quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: ['server', '/data', '--console-address', ':9001']
    environment:
      # A single-node MinIO has one pair of keys, so the root pair is also the
      # pair the app signs its requests with. Defaults are good enough for a
      # local stack; a stand passes its own through the environment, and the
      # production overlay refuses to start without them.
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-lct}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-lct-secret-key}
    # 9000 is the S3 API, 9001 the web console; host ports are shifted the same
    # way as PostgreSQL and Redis, because 9000 is a popular port.
    ports:
      - '59000:9000'
      - '59001:9001'
    volumes:
      - minio-data:/data
    healthcheck:
      test: ['CMD', 'curl', '--silent', '--fail', 'http://localhost:9000/minio/health/live']
      interval: 5s
      timeout: 5s
      retries: 20

  # Creates the buckets and exits. Bucket creation is part of installing the
  # stack, not of running it: the app only ever reads and writes objects, and
  # its keys are not meant to be able to create or drop a bucket. The second
  # bucket belongs to the end-to-end suite — `pnpm run test:e2e` runs against
  # the same MinIO and must not mix its objects with the stand's.
  minio-init:
    image: quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z
    entrypoint: ['sh', '-c']
    command:
      - mc alias set stack http://minio:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD" &&
        mc mb --ignore-existing stack/lct-documents stack/lct-documents-e2e
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-lct}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-lct-secret-key}
    depends_on:
      minio:
        condition: service_healthy

  # Imitators of the customer's systems: the CMS of the public site and the
  # learning management system. They exist so the exchange can be shown and
  # tested end to end — neither real system is reachable from outside — and
  # they are not integrations: what they answer proves nothing about the real
  # ones. Contract and endpoints: docs/exchange-contract.md, docs/integrations.md.
  #
  # Host ports are shifted the same way as PostgreSQL and Redis; inside the
  # network they answer on the ports the contract names, 8081 and 8082.
  mock-cms:
    build:
      context: ./mocks
      args:
        SERVICE: cms
        PORT: '8081'
    ports:
      - '58081:8081'
    # The e2e run keeps the imitators in containers and the app on the host, so
    # the gateway of this network has to be reachable by name from inside them.
    # `host.docker.internal` is what Docker Desktop resolves on its own and what
    # this line adds on Linux; nothing in the local stack uses it, and the
    # imitators still reach the app by its compose name.
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    environment:
      PORT: '8081'
      # Where the imitator sends an application and what it introduces itself
      # with. The key is issued by the seed of the stand from the same variable;
      # without it the imitator answers that the exchange is not configured
      # instead of pretending it sent anything. One key per connection: an
      # exchange key is bound to one (`api_keys.exchange_system`), and the site's
      # key is refused on the route of learning group results.
      #
      # The address is a variable because the app is not always in this network:
      # the e2e run builds it from the working copy and starts it on the host
      # (`e2e/stack.ts`), and an imitator that cannot reach it back would leave
      # the whole incoming direction unproven.
      CRM_BASE_URL: ${MOCK_CRM_BASE_URL:-http://app:3000}
      # Two demonstration defaults, deliberately unmistakable: this is a local
      # development stack, and a key one has to invent before the first `docker
      # compose up` is a key everyone leaves empty. They are different on
      # purpose — one key for both directions would mean the site may post the
      # results of learning groups (`scripts/seed/api-keys.ts`). A stand and a
      # deployment pass their own: docker-compose.prod.yml has no defaults at
      # all, and these two are known to anyone who has the repository.
      CRM_API_KEY: ${EXCHANGE_API_KEY_CMS:-lct_local-dev-only-cms-key-000000000}
      # The secret the CRM signs its outgoing messages with. The imitator
      # rejects an unsigned or badly signed status, so the signature is part of
      # what the stand demonstrates. The default below is good enough for a
      # local stack; a public stand passes its own.
      EXCHANGE_SECRET: ${EXCHANGE_SECRET:-exchange-stand-secret-0123456789abcdef}
      # The instance name: the CRM deduplicates applications by system,
      # instance and external id, so a second site would need a second name.
      # Same variable the app reads — two names for one thing drift apart.
      INSTANCE_NAME: ${EXCHANGE_CMS_INSTANCE:-itschool-site}
      # Токен управления имитатором (`__state`, `__scenario`, собственное тело
      # заявки у триггера). Пусто по умолчанию — управление открыто: локально
      # имитатор доступен только с петли. Прогон e2e задаёт свой
      # (`e2e/exchange-keys.ts`) и ходит к управлению с заголовком — так же, как
      # на стенде, где токен обязателен.
      CONTROL_TOKEN: ${MOCK_CONTROL_TOKEN:-}
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:8081/').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
        ]
      interval: 10s
      timeout: 5s
      retries: 6

  mock-lms:
    build:
      context: ./mocks
      args:
        SERVICE: lms
        PORT: '8082'
    ports:
      - '58082:8082'
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    environment:
      PORT: '8082'
      CRM_BASE_URL: ${MOCK_CRM_BASE_URL:-http://app:3000}
      CRM_API_KEY: ${EXCHANGE_API_KEY_LMS:-lct_local-dev-only-lms-key-000000000}
      EXCHANGE_SECRET: ${EXCHANGE_SECRET:-exchange-stand-secret-0123456789abcdef}
      INSTANCE_NAME: ${EXCHANGE_LMS_INSTANCE:-moodle-itschool}
      CONTROL_TOKEN: ${MOCK_CONTROL_TOKEN:-}
      # The address of a learning group as a person opens it. Published port,
      # not the compose name: the link is followed from a browser on the host.
      PUBLIC_URL: http://localhost:58082
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:8082/').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
        ]
      interval: 10s
      timeout: 5s
      retries: 6

  app:
    build: .
    ports:
      - '3000:3000'
    environment:
      NODE_ENV: production
      DATABASE_URL: postgres://lct:lct@postgres:5432/lct
      REDIS_URL: redis://redis:6379
      GOTENBERG_URL: http://gotenberg:3000
      # Почта уведомлений. В стеке это Mailpit по соседству: письма уходят
      # по-настоящему и оседают в его веб-интерфейсе на http://localhost:8025.
      # Установка у заказчика ставит сюда адрес своего релея.
      SMTP_URL: ${SMTP_URL:-smtp://mailpit:1025}
      SMTP_FROM: ${SMTP_FROM:-lct-crm@lct-crm.local}
      ORIGIN: http://localhost:3000
      # adapter-node answers 413 to any request body over BODY_SIZE_LIMIT before
      # the app sees it, and its default — 512K — is below the upload ceiling the
      # code enforces (MAX_DOCUMENT_SIZE_BYTES, 25 MiB), so a scan of an ordinary
      # agreement would never reach the handler. 27M clears that ceiling together
      # with the multipart envelope. Pinned here instead of taken from .env: the
      # value belongs to the upload contract in the code, not to a deployment.
      BODY_SIZE_LIMIT: 27M
      # The local stack is the demo stand: the container seeds demo data after
      # migrating and the sign-in page shows the buttons for the three demo
      # accounts. `DEMO_MODE=false docker compose up -d --build app` turns both
      # off; so does DEMO_MODE in a local .env, which Compose substitutes here —
      # a developer's own setting is not something the stand should override.
      DEMO_MODE: ${DEMO_MODE:-true}
      # Пароль демонстрационных записей на карточке входа: приложение его не
      # проверяет, а повторяет то, что задано в каталоге. Умолчание — то же, что
      # у KEYCLOAK_DEMO_PASSWORD выше; разойдутся они — карточка покажет пароль,
      # которым не войти.
      DEMO_PASSWORD_HINT: ${DEMO_PASSWORD_HINT:-lct-demo-2026}
      # The account directory. `OIDC_ISSUER_URL` is the address the server reads
      # the realm metadata from and the `iss` it checks every token against —
      # inside the network that is the container name. `OIDC_PUBLIC_URL` is where
      # the browser is sent instead: a person reaches Keycloak by the published
      # port, not by its name in the network.
      OIDC_ISSUER_URL: http://localhost:58080/realms/lct
      OIDC_PUBLIC_URL: http://localhost:58080
      # Inside the network the published port is somebody else's address, so
      # metadata, signing keys and the code exchange go straight to the
      # container; `iss` stays checked against the public name above.
      OIDC_INTERNAL_URL: http://keycloak:8080
      OIDC_CLIENT_ID: lct-crm
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:-lct-crm-dev-secret}
      # Exchange with the customer's systems. In the local stack both of them are
      # the imitators next door, reached by their compose names; a deployment
      # points these at the real CMS and LMS, or leaves them empty and the
      # directions stay off. The address of an application card carries
      # `{externalId}`: the key of the application goes there. Whatever is saved
      # on the «Внешние системы» screen wins over these values — they are the
      # defaults a stand comes up with, not the product's settings.
      EXCHANGE_CMS_STATUS_URL: ${EXCHANGE_CMS_STATUS_URL:-http://mock-cms:8081/api/applications/{externalId}/status}
      EXCHANGE_LMS_GROUPS_URL: ${EXCHANGE_LMS_GROUPS_URL:-http://mock-lms:8082/api/groups}
      # Shown as a hint in the integrations section: the web service of the LMS
      # the synchronisation of learning data goes to.
      EXCHANGE_LMS_BASE_URL: ${EXCHANGE_LMS_BASE_URL:-http://mock-lms:8082}
      # The trigger of the CMS imitator behind the «Демо: заявка с сайта» button
      # on the «Внешние системы» screen: the app presses it so the scene starts
      # where a visitor of the site would start it. Demo scaffolding, not a
      # direction of the contract — the button appears only with DEMO_MODE=true,
      # and a deployment with a real CMS leaves this empty.
      DEMO_CMS_TRIGGER_URL: ${DEMO_CMS_TRIGGER_URL:-http://mock-cms:8081/__send-application}
      # The names of the connections, and the same variables the imitators read
      # below: the CRM checks `source.instance` of an incoming message against
      # these and the seed binds an exchange key to one of them. Two names for one
      # thing would drift apart on the first stand that renames one.
      EXCHANGE_CMS_INSTANCE: ${EXCHANGE_CMS_INSTANCE:-itschool-site}
      EXCHANGE_LMS_INSTANCE: ${EXCHANGE_LMS_INSTANCE:-moodle-itschool}
      # The key the contacts of people are encrypted with before they reach the
      # database (AES-256-GCM plus a derived key for the comparison hashes). The
      # default below is for a local run only: it is printed in the repository,
      # so anyone who has the sources can read the contacts of this stack. A
      # stand and a deployment pass their own — docker-compose.prod.yml has no
      # default at all. Losing the key is irreversible: the contacts of the
      # directory go with it.
      PII_ENCRYPTION_KEY: ${PII_ENCRYPTION_KEY:-pd7xxuL6XwYqagjA3OMN0dZUR+qa4eRzqNQmQnxaPIM=}
      # The secret the CRM signs its outgoing exchange messages with — the same
      # one the imitators verify them against.
      EXCHANGE_SECRET: ${EXCHANGE_SECRET:-exchange-stand-secret-0123456789abcdef}
      # The access keys of the imitators, read by the seed and by nothing else:
      # it issues them to the machine subject of the exchange, one per
      # connection, and the imitators next door introduce themselves with the
      # same values. The defaults are the two demonstration keys of this file —
      # the same values the imitators below take, because a local stack whose
      # exchange is off until somebody invents two keys shows nothing at all.
      # They are public by definition; a stand and a deployment set their own
      # (docs/seeds.md, .env.example).
      EXCHANGE_API_KEY_CMS: ${EXCHANGE_API_KEY_CMS:-lct_local-dev-only-cms-key-000000000}
      EXCHANGE_API_KEY_LMS: ${EXCHANGE_API_KEY_LMS:-lct_local-dev-only-lms-key-000000000}
      # Nothing sits in front of the app in the local stack, so the client
      # address is the socket address and forwarding headers must not be trusted.
      TRUST_PROXY: 'false'
      # Outgoing requests stay on public addresses even here: the imitators are
      # reached by their compose names, which the rule allows by name, and
      # everything else inside this network — Keycloak, MinIO, the database — is
      # exactly what an address typed into the integrations screen must not be
      # able to reach.
      ALLOW_LOCAL_TARGETS: 'false'
      # Object storage. Inside the compose network MinIO answers on its own
      # name; path style is the only addressing that works there, because
      # `bucket.minio` resolves nowhere.
      S3_ENDPOINT: http://minio:9000
      S3_REGION: us-east-1
      S3_BUCKET: lct-documents
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-lct}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-lct-secret-key}
      S3_FORCE_PATH_STYLE: 'true'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      gotenberg:
        condition: service_healthy
      # Письмо, отправленное в ещё не поднявшийся Mailpit, превратилось бы в
      # строку «не отправлено» на первом же проходе цикла. `required: false` —
      # потому что на развёртывании Mailpit нет вовсе: там почту принимает релей
      # заказчика, и ждать здесь нечего (docker-compose.prod.yml, профиль
      # `stand`).
      mailpit:
        condition: service_healthy
        required: false
      # Without the directory nobody signs in: the application keeps no
      # passwords of its own.
      keycloak:
        condition: service_healthy
      # Not `service_healthy`: the job creates the buckets and exits, and the
      # app must not start against a storage without them.
      minio-init:
        condition: service_completed_successfully

volumes:
  postgres-data:
  redis-data:
  # Uploaded and generated documents. Lives outside the image: it must survive
  # a rebuild, and `docker compose down` without `-v` must not take it away.
  minio-data:
