name: lct-crm

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: lct
      POSTGRES_PASSWORD: lct
      POSTGRES_DB: lct
    # Host ports are shifted so the stack does not collide with a PostgreSQL or
    # Redis already running on the machine.
    ports:
      - '55432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U lct -d lct']
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:8-alpine
    command: ['redis-server', '--appendonly', 'yes']
    ports:
      - '56379:6379'
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 20

  gotenberg:
    image: gotenberg/gotenberg:8
    ports:
      - '3001:3000'
    healthcheck:
      test: ['CMD', 'curl', '--silent', '--fail', 'http://localhost:3000/health']
      interval: 10s
      timeout: 5s
      retries: 10

  # Object storage for uploaded and generated documents. The image comes from
  # quay.io: MinIO publishes its releases there, and the tag is pinned like
  # every other image in the stack.
  minio:
    image: quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: ['server', '/data', '--console-address', ':9001']
    environment:
      # A single-node MinIO has one pair of keys, so the root pair is also the
      # pair the app signs its requests with. Defaults are good enough for a
      # local stack; a stand passes its own through the environment, and the
      # production overlay refuses to start without them.
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-lct}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-lct-secret-key}
    # 9000 is the S3 API, 9001 the web console; host ports are shifted the same
    # way as PostgreSQL and Redis, because 9000 is a popular port.
    ports:
      - '59000:9000'
      - '59001:9001'
    volumes:
      - minio-data:/data
    healthcheck:
      test: ['CMD', 'curl', '--silent', '--fail', 'http://localhost:9000/minio/health/live']
      interval: 5s
      timeout: 5s
      retries: 20

  # Creates the buckets and exits. Bucket creation is part of installing the
  # stack, not of running it: the app only ever reads and writes objects, and
  # its keys are not meant to be able to create or drop a bucket. The second
  # bucket belongs to the end-to-end suite — `pnpm run test:e2e` runs against
  # the same MinIO and must not mix its objects with the stand's.
  minio-init:
    image: quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z
    entrypoint: ['sh', '-c']
    command:
      - mc alias set stack http://minio:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD" &&
        mc mb --ignore-existing stack/lct-documents stack/lct-documents-e2e
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-lct}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-lct-secret-key}
    depends_on:
      minio:
        condition: service_healthy

  mailpit:
    image: axllent/mailpit:v1.31.1
    ports:
      - '1025:1025'
      - '8025:8025'
    healthcheck:
      test: ['CMD', '/mailpit', 'readyz']
      interval: 10s
      timeout: 5s
      retries: 10

  app:
    build: .
    ports:
      - '3000:3000'
    environment:
      NODE_ENV: production
      DATABASE_URL: postgres://lct:lct@postgres:5432/lct
      REDIS_URL: redis://redis:6379
      GOTENBERG_URL: http://gotenberg:3000
      SMTP_HOST: mailpit
      SMTP_PORT: '1025'
      ORIGIN: http://localhost:3000
      # adapter-node answers 413 to any request body over BODY_SIZE_LIMIT before
      # the app sees it, and its default — 512K — is below the upload ceiling the
      # code enforces (MAX_DOCUMENT_SIZE_BYTES, 25 MiB), so a scan of an ordinary
      # agreement would never reach the handler. 27M clears that ceiling together
      # with the multipart envelope. Pinned here instead of taken from .env: the
      # value belongs to the upload contract in the code, not to a deployment.
      BODY_SIZE_LIMIT: 27M
      # The local stack is the demo stand: the container seeds demo data after
      # migrating and the sign-in page shows the buttons for the three demo
      # accounts. `DEMO_MODE=false docker compose up -d --build app` turns both
      # off; so does DEMO_MODE in a local .env, which Compose substitutes here —
      # a developer's own setting is not something the stand should override.
      DEMO_MODE: ${DEMO_MODE:-true}
      # Read by the seed script, never by the server. The value below is good
      # enough for a local stack; a public stand passes its own.
      SEED_DEMO_PASSWORD: ${SEED_DEMO_PASSWORD:-Demo-Password-2026!}
      # The staff administrator — the one account that is not part of the demo.
      # Deliberately without a default: an empty value is the same as unset for
      # the seed, so the stand simply has no such account until someone passes
      # a password (`SEED_STAFF_ADMIN_PASSWORD='…' docker compose up --build`).
      # A default here would ship a known password to every public stand.
      SEED_STAFF_ADMIN_PASSWORD: ${SEED_STAFF_ADMIN_PASSWORD:-}
      # The local stack is the demo stand, so the Moodle stand-in under /mock-lms
      # is on: the customer's real LMS is not reachable from outside, and the
      # exchange has nothing to be shown against without it. `MOCK_LMS=false
      # docker compose up -d --build app` turns it off, and so does MOCK_LMS in a
      # local .env, which Compose substitutes here.
      MOCK_LMS: ${MOCK_LMS:-true}
      # Nothing sits in front of the app in the local stack, so the client
      # address is the socket address and forwarding headers must not be trusted.
      TRUST_PROXY: 'false'
      # Object storage. Inside the compose network MinIO answers on its own
      # name; path style is the only addressing that works there, because
      # `bucket.minio` resolves nowhere.
      S3_ENDPOINT: http://minio:9000
      S3_REGION: us-east-1
      S3_BUCKET: lct-documents
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-lct}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-lct-secret-key}
      S3_FORCE_PATH_STYLE: 'true'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      gotenberg:
        condition: service_healthy
      mailpit:
        condition: service_healthy
      # Not `service_healthy`: the job creates the buckets and exits, and the
      # app must not start against a storage without them.
      minio-init:
        condition: service_completed_successfully

volumes:
  postgres-data:
  redis-data:
  # Uploaded and generated documents. Lives outside the image: it must survive
  # a rebuild, and `docker compose down` without `-v` must not take it away.
  minio-data:
