# Production overlay. Always used together with the base file:
#
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build
#
# What it changes compared to the local stack:
#   - only the app is reachable from the host, and only on the loopback
#     interface; a reverse proxy in front of it terminates TLS;
#   - every service restarts by itself after a crash or a host reboot;
#   - every service has a memory limit, so one runaway container cannot take
#     the whole machine down;
#   - the app takes its configuration from `.env` instead of the values
#     hardcoded in the base file for local development.
#
# Deployment instructions: docs/deployment.md.

services:
  postgres:
    restart: unless-stopped
    # The database is reachable over the compose network only. Dumps are taken
    # with `docker compose exec postgres pg_dump`, see docs/deployment.md.
    ports: !reset []
    # `!override`, а не слияние: в базовом файле пароль набран строкой (`lct`) —
    # это умолчание локального стека, и развёртывание не должно съезжать на него
    # молча. Наружу база не выходит, но внутри сети compose стоят и имитаторы
    # профиля `stand`, и Keycloak со своим realm в той же СУБД, поэтому пароль
    # обязан быть свой. Имя пользователя и базы остаётся `lct`: это не секрет, а
    # форма развёртывания — на него ссылаются healthcheck, скрипт создания базы
    # каталога и команды из docs/deployment.md.
    #
    # Смена пароля на уже развёрнутом стенде — не только строка в `.env`: том
    # базы помнит прежний, и порядок описан в docs/deployment.md, раздел
    # «Пароли СУБД».
    environment: !override
      POSTGRES_USER: lct
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: lct
    deploy:
      resources:
        limits:
          memory: 512M

  redis:
    restart: unless-stopped
    ports: !reset []
    # Redis держит сессии, замки фоновых проходов и счётчики лимитов, то есть
    # вход в систему: сосед по сети compose, дотянувшийся до него без пароля,
    # читает и переписывает чужие сессии. `$$` — доллар для оболочки внутри
    # контейнера, а не для подстановки Compose: пароль остаётся в переменной и
    # не попадает в командную строку процесса.
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}
    command: !override
      - sh
      - -c
      - exec redis-server --appendonly yes --requirepass "$$REDIS_PASSWORD"
    # Проба базового файла ходит без пароля и получала бы `NOAUTH`: контейнер
    # считался бы больным при исправном Redis.
    healthcheck: !override
      test: ['CMD-SHELL', 'redis-cli --no-auth-warning -a "$$REDIS_PASSWORD" ping | grep -q PONG']
      interval: 5s
      timeout: 5s
      retries: 20
    deploy:
      resources:
        limits:
          memory: 128M

  gotenberg:
    restart: unless-stopped
    ports: !reset []
    # Bundles LibreOffice and Chromium; by far the hungriest service here.
    deploy:
      resources:
        limits:
          memory: 768M

  # Почтовый сервер стенда. В профиле `stand`, как и имитаторы, и по той же
  # причине: установка, которая отправляет почту через релей заказчика, не
  # должна держать рядом второй почтовый сервер, ловящий всё в свой ящик. Стенд
  # поднимает его явно — `--profile stand` — и тогда же ставит `SMTP_URL` на
  # `smtp://mailpit:1025` в своём `.env`.
  mailpit:
    profiles: ['stand']
    restart: unless-stopped
    # `!override`, а не merge: базовый файл публикует оба порта на всех
    # интерфейсах, и здесь этого быть не должно.
    #
    # SMTP наружу не выходит вовсе — письма в ящик стенда пишет только само
    # приложение из соседнего контейнера. Веб-интерфейс остаётся на loopback
    # хоста, как приложение и каталог: увидеть его можно лишь через туннель, а
    # увидеть надо — показать, что уведомление ушло, больше нечем. Писем с
    # чужими данными в этом ящике не бывает: стенд работает на синтетике.
    ports: !override
      - '127.0.0.1:${MAILPIT_PORT:-8025}:8025'
    deploy:
      resources:
        limits:
          memory: 128M

  minio:
    restart: unless-stopped
    # Neither the S3 API nor the console is published: the app reaches the
    # storage over the compose network, and the console shows every document
    # the system keeps. Look at it through an SSH tunnel to 9001 when needed.
    ports: !reset []
    # `!override` instead of merging: the defaults from the base file are for a
    # local stack, and a deployment must not silently fall back to them. `:?`
    # stops `docker compose up` with the message below when the variable is
    # missing from `.env`.
    environment: !override
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:?set S3_ACCESS_KEY in .env}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:?set S3_SECRET_KEY in .env}
    deploy:
      resources:
        limits:
          memory: 512M

  minio-init:
    # No bucket for the end-to-end suite here: it never runs against a
    # deployment, and an empty bucket nobody writes to is one more thing to
    # explain during a backup.
    command: !override
      - mc alias set stack http://minio:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD" &&
        mc mb --ignore-existing stack/lct-documents
    environment: !override
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:?set S3_ACCESS_KEY in .env}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:?set S3_SECRET_KEY in .env}
    deploy:
      resources:
        limits:
          memory: 64M

  # The account directory on a stand: PostgreSQL instead of the built-in H2, a
  # pinned public name and the path `/auth` behind the same nginx as the app.
  keycloak:
    restart: unless-stopped
    # `start` instead of `start-dev`: the production mode, without H2 and without
    # «the hostname from the request». `--optimized` is not an option here — it
    # needs an image built by `kc.sh build` against PostgreSQL, and the image is
    # taken ready from quay; so Keycloak augments its configuration itself at
    # startup, which costs about five seconds. `--import-realm` only fires on an
    # empty database: a realm imported earlier is left alone, and edits to a realm
    # of a running stand are made through the admin console (docs/deployment.md).
    command: !override ['start', '--import-realm']
    # Loopback only, like the app: Keycloak faces the world through nginx, the
    # vhost fragment is in docs/deployment.md.
    ports: !override
      - '127.0.0.1:${KEYCLOAK_PORT:-8098}:8080'
    # `!override` instead of merging: the values in the base file are for a local
    # stack, and a deployment must not silently fall back to them. `:?` stops
    # `docker compose up` with the message below when the variable is missing
    # from `.env`.
    environment: !override
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN:?set KEYCLOAK_ADMIN in .env}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?set KEYCLOAK_ADMIN_PASSWORD in .env}
      KC_HEALTH_ENABLED: 'true'
      # Its own database in the same PostgreSQL. The init script from `keycloak/`
      # creates it when the volume is initialised; on a stand that already works
      # it is the command from docs/deployment.md.
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      # Тот же пользователь и тот же пароль, что у базы рядом: realm каталога
      # лежит в той же СУБД, и второе значение здесь означало бы стенд, который
      # поднимается с одним паролем, а ходит с другим.
      KC_DB_USERNAME: lct
      KC_DB_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      # The public address of Keycloak in full, path included: it builds the links
      # in its login pages and OIDC metadata from it, and it is the `iss` of every
      # token it issues. The path has to match KC_HTTP_RELATIVE_PATH, otherwise
      # those links lead past nginx.
      KC_HOSTNAME: ${OIDC_PUBLIC_URL:?set OIDC_PUBLIC_URL in .env}
      KC_HTTP_RELATIVE_PATH: /auth
      # Keycloak carries the relative path over to the management port as well, so
      # the health probe would move to `/auth/health/ready` — while it is declared
      # in the base file and asks for `/health/ready`. The management port is not
      # published at all, so its path goes back to the root instead of the probe
      # being written twice.
      KC_HTTP_MANAGEMENT_RELATIVE_PATH: /
      # TLS is terminated by nginx and the request reaches the container over
      # http; the scheme, the client address and the host name come from the
      # X-Forwarded-* headers. Without `KC_PROXY_HEADERS` Keycloak considers the
      # connection unencrypted and bounces the login back to http.
      KC_HTTP_ENABLED: 'true'
      KC_PROXY_HEADERS: xforwarded
      CRM_ORIGIN: ${ORIGIN:?set ORIGIN in .env}
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:?set OIDC_CLIENT_SECRET in .env}
      KEYCLOAK_DEMO_PASSWORD: ${SEED_DEMO_PASSWORD:?set SEED_DEMO_PASSWORD in .env}
    depends_on:
      postgres:
        condition: service_healthy
    # 512M is enough to start on, but the container then lives right at the
    # ceiling — 510 MB of 512 at rest, measured — and the first burst of load
    # means an OOM kill. At 768 it sits at about 600 MB.
    deploy:
      resources:
        limits:
          memory: 768M

  # The imitators are a demonstration prop, like the Moodle stand-in: a
  # deployment that talks to the real systems must not have a second source of
  # applications and learning data next to them. The `stand` profile keeps them
  # out of `docker compose up -d` unless the deployment is itself the demo
  # stand, which starts them with `--profile stand`; naming a service on the
  # command line enables its profile too, so `docker compose up -d mock-cms`
  # still works. Сам обмен идёт внутри сети compose; наружу через прокси стенда
  # открыты только страница состояния и триггеры — то, чем сцену запускают и по
  # чему видно, что она доехала.
  mock-cms:
    profiles: ['stand']
    restart: unless-stopped
    # На петлю хоста, как приложение и каталог: показать сцену «заявка с сайта»
    # зрителю нужно, а значит, страница состояния и триггер обязаны быть
    # достижимы снаружи — но только через прокси, где открыты ровно они
    # (`deploy/nginx/crm.conf.example`, `docs/deployment.md`). Базовый файл
    # публикует порт на всех интерфейсах, поэтому `!override`.
    ports: !override
      - '127.0.0.1:${MOCK_CMS_PORT:-8091}:8081'
    # `!override` instead of merging: the secret in the base file is a local
    # development default, and a deployment must not silently fall back to it.
    # Empty is honest — the imitator answers that the exchange is not
    # configured — while a wrong secret would look like a working signature.
    environment: !override
      PORT: '8081'
      CRM_BASE_URL: http://app:3000
      # One key per connection: an exchange key is bound to one
      # (`api_keys.exchange_system`), and the site's key is refused on the route
      # of learning group results. The seed of the stand issues both from the
      # same variables.
      #
      # `?` без двоеточия: переменная обязана быть названа в `.env`
      # развёртывания, а умолчания у неё нет вовсе — демонстрационные ключи
      # базового файла напечатаны в репозитории, и стенд, молча взявший их,
      # принимал бы заявки от кого угодно. Пустое значение остаётся решением:
      # установка без имитаторов ключей обмена не заводит.
      CRM_API_KEY: ${EXCHANGE_API_KEY_CMS?declare EXCHANGE_API_KEY_CMS in .env}
      EXCHANGE_SECRET: ${EXCHANGE_SECRET:-}
      # Токен управляющих адресов имитатора (`__state`, `__scenario`). Прокси их
      # наружу не пускает; токен — вторая граница, на случай своей конфигурации
      # прокси и на случай туннеля к опубликованному порту. Пусто — управление
      # открыто всем, кто дотянулся до петли хоста (`docs/security.md`).
      # `:?` с двоеточием: пустое значение здесь снимало бы вторую границу
      # целиком — имитатор без токена пускает к управлению всякого, кто до него
      # дотянулся, а на стенде страница и триггер выходят наружу через прокси.
      # Значение нужно и установке без имитаторов: подстановка Compose идёт по
      # всему файлу сразу, профили её не отменяют.
      CONTROL_TOKEN: ${MOCK_CONTROL_TOKEN:?set MOCK_CONTROL_TOKEN in .env}
      # The same variable the app reads: the CRM checks `source.instance` of an
      # incoming application against its own setting, and two variables with one
      # default would silently drift apart on the first stand that renames one.
      INSTANCE_NAME: ${EXCHANGE_CMS_INSTANCE:-itschool-site}
    deploy:
      resources:
        limits:
          memory: 64M

  mock-lms:
    profiles: ['stand']
    restart: unless-stopped
    ports: !override
      - '127.0.0.1:${MOCK_LMS_PORT:-8092}:8082'
    environment: !override
      PORT: '8082'
      CRM_BASE_URL: http://app:3000
      CRM_API_KEY: ${EXCHANGE_API_KEY_LMS?declare EXCHANGE_API_KEY_LMS in .env}
      EXCHANGE_SECRET: ${EXCHANGE_SECRET:-}
      CONTROL_TOKEN: ${MOCK_CONTROL_TOKEN:?set MOCK_CONTROL_TOKEN in .env}
      INSTANCE_NAME: ${EXCHANGE_LMS_INSTANCE:-moodle-itschool}
      # Адрес группы для человека: через тот же прокси, что и приложение, —
      # `https://<домен>/mock-lms/`. Без него ссылка ведёт на имя контейнера и
      # честно недостижима снаружи.
      PUBLIC_URL: ${EXCHANGE_LMS_PUBLIC_URL:-http://mock-lms:8082}
    deploy:
      resources:
        limits:
          memory: 64M

  app:
    restart: unless-stopped
    # `!override` replaces the port list instead of appending to it: the base
    # file publishes 3000 on every interface, which must not happen here.
    ports: !override
      - '127.0.0.1:${APP_PORT:-8099}:3000'
    # `!override` replaces the development values from the base file instead of
    # merging with them, so nothing silently shadows `.env` — `environment` wins
    # over `env_file` in Compose. What stays here describes the shape of the
    # deployment, not its secrets: the S3_* values below point at the MinIO of
    # this stack (the keys themselves are secrets and come from `.env`), and
    # BODY_SIZE_LIMIT has to clear the upload ceiling the code enforces
    # (MAX_DOCUMENT_SIZE_BYTES, 25 MiB) plus the multipart envelope — with the
    # 512K default adapter-node answers 413 to any scan before the app sees it.
    # A deployment does not get to lower it: `client_max_body_size` in the proxy
    # is the knob for that, see docs/deployment.md.
    #
    # ADDRESS_HEADER and XFF_DEPTH are deliberately NOT set. With them
    # adapter-node resolves the client address itself and throws on every
    # request that carries no X-Forwarded-For — and the imitators of the `stand`
    # profile reach the app at http://app:3000 inside this network, with no
    # proxy in between, so the whole exchange answered 500. The app reads the
    # header on its own instead (TRUST_PROXY in `.env`, `clientAddress()` in
    # src/lib/server/http.ts): header present — the address our proxy appended
    # to it, header absent — the socket address.
    environment: !override
      # Строки подключения собираются здесь, из тех же переменных, которыми
      # подняты сама база и Redis: набранные отдельной строкой в `.env`, они
      # разъехались бы с паролем СУБД на первой же его смене — и приложение
      # молча перестало бы подниматься. `environment` сильнее `env_file`,
      # поэтому `DATABASE_URL` и `REDIS_URL` из `.env` на развёртывании не
      # читаются вовсе (docs/deployment.md).
      DATABASE_URL: postgres://lct:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@postgres:5432/lct
      REDIS_URL: redis://:${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}@redis:6379
      # The directory answers the browser at its public address through nginx;
      # the app asks it from inside the network. The path has to match
      # KC_HTTP_RELATIVE_PATH of Keycloak below, or the request lands in the
      # container's root. `iss` is still checked against OIDC_ISSUER_URL from
      # `.env` — the public name.
      OIDC_INTERNAL_URL: http://keycloak:8080/auth
      # Почта уведомлений. Пусто по умолчанию: установка, которой нечем
      # отправлять, не должна делать вид, что письма уходят, — канал «почта»
      # честно пишет в журнал доставок, что сервер не настроен. Стенд с профилем
      # `stand` ставит в своём `.env` `smtp://mailpit:1025`; установка у
      # заказчика — адрес своего релея. `environment` сильнее `env_file`, поэтому
      # переменные названы здесь — иначе их нельзя было бы задать вовсе.
      SMTP_URL: ${SMTP_URL:-}
      SMTP_FROM: ${SMTP_FROM:-}
      S3_ENDPOINT: http://minio:9000
      S3_REGION: us-east-1
      S3_BUCKET: lct-documents
      S3_FORCE_PATH_STYLE: 'true'
      BODY_SIZE_LIMIT: 27M
      # Exchange with the customer's systems. Empty by default: a deployment that
      # has no CMS and no LMS to talk to must not queue messages nobody will ever
      # read. A stand that runs the imitators of the `stand` profile sets these to
      # their compose names in its own `.env` — `environment` wins over
      # `env_file`, so the variables have to be named here to be settable at all.
      EXCHANGE_CMS_STATUS_URL: ${EXCHANGE_CMS_STATUS_URL:-}
      EXCHANGE_LMS_GROUPS_URL: ${EXCHANGE_LMS_GROUPS_URL:-}
      EXCHANGE_LMS_BASE_URL: ${EXCHANGE_LMS_BASE_URL:-}
      # Триггер имитатора CMS за кнопкой «Демо: заявка с сайта». Пусто —
      # кнопки нет: установка с настоящей CMS не нажимает её заявки за неё.
      # Стенд профиля `stand` ставит здесь `http://mock-cms:8081/__send-application`.
      DEMO_CMS_TRIGGER_URL: ${DEMO_CMS_TRIGGER_URL:-}
      EXCHANGE_CMS_INSTANCE: ${EXCHANGE_CMS_INSTANCE:-itschool-site}
      EXCHANGE_LMS_INSTANCE: ${EXCHANGE_LMS_INSTANCE:-moodle-itschool}
      EXCHANGE_SECRET: ${EXCHANGE_SECRET:-}
      # Ключ шифрования контактов людей. `?` без двоеточия: переменная обязана
      # быть названа в `.env`, умолчания нет — ключ из репозитория не защищает
      # ни от чего, а пустой означал бы, что установка не читает ни одного
      # контакта. Генерируется один раз: `openssl rand -base64 32`, и вместе с
      # ним теряются все контакты справочника (docs/deployment.md).
      PII_ENCRYPTION_KEY: ${PII_ENCRYPTION_KEY?declare PII_ENCRYPTION_KEY in .env}
      # Read by the seed and by nothing else: on a stand with DEMO_MODE=true it
      # issues the exchange keys of the imitators from these — through the UI
      # nobody there could, the demo session has no `api_keys.manage` and the
      # staff administrator has no account in the directory yet. A deployment
      # that talks to the real systems leaves them empty and issues keys the
      # usual way.
      #
      # `?` без двоеточия: названа в `.env` обязана быть, умолчания нет —
      # демонстрационные ключи базового файла напечатаны в репозитории. Пустое
      # значение остаётся решением развёртывания: ключей обмена тогда нет.
      EXCHANGE_API_KEY_CMS: ${EXCHANGE_API_KEY_CMS?declare EXCHANGE_API_KEY_CMS in .env}
      EXCHANGE_API_KEY_LMS: ${EXCHANGE_API_KEY_LMS?declare EXCHANGE_API_KEY_LMS in .env}
      # Hosts inside the network the server may reach on its own (names, addresses,
      # CIDR networks, comma-separated): `mock-cms,mock-lms` on the stand, the CMS
      # and LMS of the customer otherwise. Everything else on loopback and in
      # private networks stays closed — the account directory, the object storage
      # and the cloud metadata service next door included. `?` without the colon:
      # it must be named in `.env`; empty means public addresses only.
      OUTBOUND_ALLOWED_HOSTS: ${OUTBOUND_ALLOWED_HOSTS?declare OUTBOUND_ALLOWED_HOSTS in .env}
    env_file:
      - .env
    # Файлы фирменной гарнитуры Rostelecom Basis. В образе их нет и в
    # репозитории тоже: лицензии на распространение у команды нет, поэтому на
    # стенд они попадают каталогом с машины — `FONTS_DIR` в `.env`, по умолчанию
    # `static/fonts` рядом с исходниками (docs/deployment.md, «Шрифт»).
    # `/app/build/client` — это то, что adapter-node отдаёт как статику, значит
    # содержимое каталога видно по адресу `/fonts/...`. Каталога нет или он пуст
    # — приложение работает целиком, только на запасной гарнитуре: шрифт
    # отвечает 404, браузер берёт следующее семейство в `--font-sans`.
    # Только на чтение: контейнер этим файлам не хозяин.
    volumes:
      - ${FONTS_DIR:-./static/fonts}:/app/build/client/fonts:ro
    deploy:
      resources:
        limits:
          memory: 512M
